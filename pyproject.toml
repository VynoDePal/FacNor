[project]
name = "facnor"
version = "0.1.0"
description = "API de facturation électronique conforme"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "PyJWT>=2.8.0",
    "SQLAlchemy>=2.0.29",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
